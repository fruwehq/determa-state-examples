[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "determa-fastapi-order-service-example"
version = "0.1.0"
description = "A durable FastAPI order workflow powered by Determa State"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
  "determa-state==0.1.0",
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.9",
]

[project.scripts]
order-service = "order_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/order_service"]

[tool.hatch.build.targets.wheel.force-include]
"machines" = "order_service/machines"
"migrations" = "order_service/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/order_service", "tests"]
