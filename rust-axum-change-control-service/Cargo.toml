[package]
name = "determa-change-control"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.4"
determa-state = { git = "https://github.com/fruwehq/determa-state-rust", rev = "efaed0a21409f75ed55f159a6f8c833f3b62e88c", version = "=0.3.0", default-features = false, features = ["sqlite"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.21.0"
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
