name: python-fastapi-order-service

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog-freshness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/check-release-freshness.py --candidate-version 0.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python-fastapi-order-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python-fastapi-order-service/requirements-dev.lock.txt
      - run: make install
      - run: make check
