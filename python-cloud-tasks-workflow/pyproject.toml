[project]
name = "determa-cloud-tasks-workflow-example"
version = "0.3.0"
requires-python = ">=3.11,<3.14"
dependencies = [
 "determa-state @ git+https://github.com/fruwehq/determa-state-python.git@e7406f35735832fc46ecbc2f668b178dbb6d65fd",
 "google-cloud-tasks==2.21.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
